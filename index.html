<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: sans-serif;
            background: #ffecf7;
            text-align: center;
        }

        h1 {
            color: #310652;
        }
        h2{
            color: rgb(25, 3, 34);
        }
        p{
            color: #310652;
        }
        details {
            border: 1px solid;
            border-radius: 10px;
            padding: 10px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            color: #c5240b;
        }

        img {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #d33535;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #5b27ae;
        }
    summary{
            color: rgb(84, 2, 105);
        }
        p{
            color: darkslategrey;
        }
                
    </style>

    <head>

            </details>
            <br>

            <br>
            <p> This is cute cat </p>
            <p> Buy Now </p>

        <script>

</html>
